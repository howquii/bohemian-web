<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Demo de mapa de lotes · *BOHEMIAN</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="mapa"></div>
    <section id="cab" class="tarjeta"></section>

    <aside id="panel" class="tarjeta" hidden>
      <button class="cerrar" aria-label="Cerrar">×</button>
      <div class="ficha"></div>
    </aside>

    <section id="tour" hidden>
      <div class="psv"></div>
      <button class="cerrar" aria-label="Cerrar recorrido">×</button>
      <label class="ajuste tarjeta">Ajuste de rumbo <span id="ajusteVal">0°</span>
        <input id="ajuste" type="range" min="-15" max="15" step="0.5" value="0" />
      </label>
      <nav class="tira"></nav>
    </section>

    <script type="module" src="/src/lotes.ts"></script>
  </body>
</html>
